name: QA Postman Audit

on:
  push:
  pull_request:

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install
        run: npm install

      - name: Build
        run: npm run build

      - name: Run unit tests
        run: npm test

      - name: Run audit (example)
        run: node dist/index.js --collection examples/sample-collection.json --out qa-audit-report

      - name: Upload report artifact
        uses: actions/upload-artifact@v4
        with:
          name: qa-audit-report
          path: qa-audit-report
